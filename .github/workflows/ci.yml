name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        # The versions of the posts are read from the whole history of
        # origin/main; the build fails on a shallow clone.
        with:
          fetch-depth: 0

      # Installs the Node.js and pnpm versions pinned in mise.toml.
      - name: Setup tools
        uses: jdx/mise-action@v5

      # Dependency lifecycle scripts never run: pnpm only runs the ones allowed
      # in pnpm-workspace.yaml (`allowBuilds`), and none are.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Check types
        run: pnpm run check

      - name: Build
        run: pnpm run build
