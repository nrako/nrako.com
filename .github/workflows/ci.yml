name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # NOTE: postinstall scripts are intentionally NOT approved here. Native
      # binaries (sharp, workerd, fsevents) ship as separate prebuilt deps
      # (@img/sharp-*, @cloudflare/workerd-*) that don't require postinstall.
      # If a dep ever needs --allow-scripts, allowlist it explicitly:
      # `deno install --allow-scripts=npm:foo --frozen`.
      - name: Install dependencies
        run: deno install --frozen

      - name: Lint
        run: deno task lint

      - name: Check formatting
        run: deno task format:check

      - name: Check types
        run: deno task check

      - name: Build
        run: deno task build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
