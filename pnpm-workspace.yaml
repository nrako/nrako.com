# Dependency lifecycle scripts are denied explicitly. esbuild and workerd ship
# their native binaries as prebuilt optional dependencies, so their install
# scripts are not needed. To allow an audited script, set its entry to `true`.
allowBuilds:
  esbuild: false
  workerd: false

# Oxc tools ship weekly and the project tracks their latest release, so they
# are exempt from the minimum release age.
minimumReleaseAgeExclude:
  - oxlint
  - '@oxlint/*'
  - tsrs
  - '@tsrs/*'
  - oxfmt
  - '@oxfmt/*'
